<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complain Box - UIU Dock</title>
<meta name="description" content="File a complaint to UIU Dock staff.">
<meta name="theme-color" content="#A63608">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"></head><body class="pg-login">
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar"><div class="topbar-inner"><div class="logo">UIU <span>Dock</span></div>
<button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">☰ Menu</button>
<nav class="nav" id="mainNav" aria-label="Main"><a href="index.html">Home</a><a href="resources.html">Resources</a><a href="rooms.html">Study Rooms</a><a href="help-desk.html">Help Desk</a><a href="complain.html" class="active" aria-current="page">Complain</a><a href="login.html">Login</a></nav><div class="notif-wrap"><button id="notifBtn" onclick="toggleNotifs(event)" aria-label="Notifications">🔔<span id="notifCount"></span></button><div id="notifPanel"></div></div></div></header>
<main class="wrap wrap-narrow" id="main">
<div class="page-head" data-reveal><div class="icon-badge ib-help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="7" x2="12" y2="11"/><line x1="12" y1="14" x2="12.01" y2="14"/></svg></div><div><h1>Complain Box</h1><p class="meta">Tell staff what's wrong — it lands directly in their inbox.</p></div></div>
<div class="card" data-reveal style="margin-top:14px"><h2>File a complaint</h2><p class="meta">Members only. Staff reply via your notifications.</p><br>
<label class="meta" for="cSub">Subject *</label><input id="cSub" placeholder="e.g. Wrong solution in CSE 222 chat"><div class="err" id="eSub"></div>
<label class="meta" for="cCat" style="margin-top:10px;display:block">Category</label><select id="cCat"><option>Academic issue</option><option>Harassment / abuse</option><option>Spam</option><option>Wrong / outdated content</option><option>Technical problem</option><option>Other</option></select>
<label class="meta" for="cCourse" style="margin-top:10px;display:block">Related course (optional)</label><select id="cCourse"><option value="">— None —</option></select>
<label class="meta" for="cDet" style="margin-top:10px;display:block">Details *</label><textarea id="cDet" rows="5" placeholder="Describe what happened, where, and when..."></textarea><div class="err" id="eDet"></div><br>
<div class="modal-actions"><button class="btn btn-block" onclick="doComplain()">Submit complaint →</button></div>
</div>
<div class="card" data-reveal style="margin-top:12px"><h2 style="font-size:15px">My complaints</h2><div id="mine"></div></div>
</main>
<div class="footer">UIU Dock • Complain Box</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/seed.js"></script><script src="js/store.js"></script>
<script>document.documentElement.classList.add('js');
let db=getDB();
const cc=document.getElementById('cCourse');
db.courses.forEach(c=>{cc.innerHTML+=`<option>${c.code}</option>`;});
function renderMine(){
  const me=db.user?db.user.name:null;
  const mine=me?db.reports.filter(r=>r.kind==='complaint'&&r.by===me):[];
  document.getElementById('mine').innerHTML=mine.map(r=>`<div class="set-row"><div class="grow"><b>${escapeHTML(r.label)}</b><p class="meta">${escapeHTML(r.reason)} • <span class="badge ${r.status==='open'?'pend':'ok'}">${escapeHTML(r.status)}</span></p></div></div>`).join('')||'<p class="meta">No complaints filed yet.</p>';
}
function doComplain(){
  if(!requireAuth('Create an account to file complaints'))return;
  const s=document.getElementById('cSub').value.trim(),d=document.getElementById('cDet').value.trim();
  showErr('eSub',s?'':'Enter a subject.');showErr('eDet',d?'':'Describe the issue.');
  if(!s||!d)return;
  const cat=document.getElementById('cCat').value,course=cc.value;
  if(fileReport('complaint',{label:'['+cat+'] '+s,course:course||null,reason:d}))toast('Complaint sent — staff will review');
  db=getDB();document.getElementById('cSub').value='';document.getElementById('cDet').value='';renderMine();
}
renderMine();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));</script>
</body></html>
